<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人吉と有田焼お散歩</title>
<meta property="og:title" content="人吉と有田焼お散歩">
<meta property="og:description" content="2026年10月15日〜19日 姉妹旅行の旅程アプリ">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1F4E79">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --blue:#1F4E79; --blue-dark:#173A5A; --blue-light:#E8F0F8;
    --red:#C8462E; --red-light:#FBE9E5;
    --bg:#F4F1EA; --white:#FFFFFF;
    --ink:#1E2A38; --ink-mid:#4C5A6B; --ink-light:#8A97A8;
    --line:#E3DED4;
    --shadow:0 1px 4px rgba(20,30,50,0.08);
    --r:16px; --rs:10px;
  }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  #app { max-width:430px; margin:0 auto; min-height:100vh; background:var(--bg); }
  button { font-family:inherit; }

  /* HEADER */
  .hdr {
    background:linear-gradient(150deg, #173A5A 0%, #1F4E79 55%, #2E6AA0 100%);
    color:#fff; padding:52px 20px 18px; position:relative; overflow:hidden;
  }
  .hdr::after {
    content:''; position:absolute; right:-40px; top:-40px; width:170px; height:170px;
    border-radius:50%; border:22px solid rgba(255,255,255,0.07);
  }
  .hdr-sub { font-size:11px; letter-spacing:2px; opacity:.7; margin-bottom:3px; }
  .hdr-title { font-size:21px; font-weight:800; margin-bottom:2px; letter-spacing:.5px; }
  .hdr-dates { font-size:12px; opacity:.82; }
  .hdr-btns { position:absolute; top:14px; right:14px; display:flex; gap:6px; z-index:1; }
  .hbtn {
    background:rgba(255,255,255,.2); border:none; border-radius:20px; color:#fff;
    padding:6px 12px; font-size:12px; cursor:pointer;
  }
  .hdr-members { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .chip { background:rgba(255,255,255,.16); border-radius:12px; padding:2px 9px; font-size:11px; }

  /* TABS */
  .tabs-wrap { background:var(--white); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; box-shadow:var(--shadow); }
  .tabs { display:flex; overflow-x:auto; scrollbar-width:none; padding:0 4px; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex-shrink:0; padding:10px 12px 8px; border:none; background:none; cursor:pointer;
    font-size:12px; color:var(--ink-light); border-bottom:3px solid transparent; white-space:nowrap;
  }
  .tab.active { color:var(--blue); border-bottom-color:var(--red); font-weight:700; }
  .tab small { display:block; font-size:9px; opacity:.75; margin-top:1px; }

  /* MAIN */
  .main { padding:16px 14px 100px; }
  .day-hdr { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .day-num {
    width:48px; height:48px; background:var(--blue); color:#fff; border-radius:12px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
  }
  .day-num small { font-size:9px; opacity:.8; margin-bottom:2px; }
  .day-num b { font-size:20px; }
  .day-title { font-size:16px; font-weight:800; }
  .day-date { font-size:12px; color:var(--ink-mid); }

  /* TIMELINE */
  .tl { position:relative; padding-left:26px; }
  .tl::before { content:''; position:absolute; left:9px; top:8px; bottom:8px; width:2px; background:var(--line); }
  .ev { position:relative; margin-bottom:12px; }
  .ev::before {
    content:''; position:absolute; left:-22px; top:16px; width:10px; height:10px; border-radius:50%;
    background:var(--white); border:3px solid var(--blue);
  }
  .ev.flight::before { background:var(--red); border-color:var(--red); }
  .ev.hotel::before { background:var(--blue); }
  .card {
    background:var(--white); border-radius:var(--r); padding:13px 14px; box-shadow:var(--shadow); cursor:pointer;
    border:1px solid transparent;
  }
  .card:active { border-color:var(--blue-light); }
  .card-top { display:flex; align-items:flex-start; gap:10px; }
  .ico { font-size:22px; line-height:1; margin-top:1px; flex-shrink:0; }
  .card-time { font-size:11px; color:var(--red); font-weight:700; letter-spacing:.3px; }
  .card-title { font-size:15px; font-weight:700; margin:1px 0 4px; }
  .card-detail { font-size:12.5px; color:var(--ink-mid); white-space:pre-line; }
  .card-note { margin-top:8px; background:#FFF8E1; border-radius:8px; padding:7px 10px; font-size:12px; color:#7A5A00; white-space:pre-line; }
  .card-link { display:inline-block; margin-top:8px; font-size:12px; color:var(--blue); text-decoration:none; font-weight:600; }
  .edit-hint { position:absolute; right:12px; top:12px; font-size:12px; color:var(--ink-light); }

  /* FLIGHT CARD */
  .fcard { background:linear-gradient(135deg, #173A5A, #2E6AA0); color:#fff; border-radius:var(--r); padding:14px 16px; cursor:pointer; box-shadow:var(--shadow); }
  .fcard .airline { font-size:11px; opacity:.85; letter-spacing:1px; display:flex; justify-content:space-between; }
  .froute { display:flex; align-items:center; justify-content:space-between; margin:10px 0 8px; }
  .fpt { text-align:center; }
  .fpt b { font-size:26px; display:block; letter-spacing:1px; }
  .fpt span { font-size:11px; opacity:.85; }
  .fpt em { font-style:normal; font-size:15px; font-weight:700; display:block; margin-top:2px; }
  .fline { flex:1; margin:0 12px; position:relative; height:2px; background:rgba(255,255,255,.4); }
  .fline::after { content:'✈'; position:absolute; left:50%; top:50%; transform:translate(-50%,-55%); font-size:16px; background:transparent; }
  .fmeta { font-size:11.5px; opacity:.9; white-space:pre-line; }
  .fseat { background:rgba(255,255,255,.18); border-radius:8px; padding:2px 8px; font-size:11px; }

  /* BACKUP */
  .bk { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .bk-t { font-size:12px; color:var(--blue); font-weight:700; background:none; border:none; cursor:pointer; padding:0; display:flex; align-items:center; gap:6px; }
  .bk-t::before { content:'▶'; font-size:9px; transition:transform .2s; }
  .bk.open .bk-t::before { transform:rotate(90deg); }
  .bk-body { display:none; font-size:12.5px; color:var(--ink-mid); white-space:pre-line; margin-top:8px; background:var(--blue-light); border-radius:8px; padding:9px 11px; }
  .bk.open .bk-body { display:block; }

  /* REF IMAGE */
  .refimg { margin-top:10px; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .refimg img { width:100%; display:block; }
  .refcap { font-size:11px; color:var(--ink-light); margin-top:4px; }

  /* PHOTOS */
  .photos { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .photos img { width:64px; height:64px; object-fit:cover; border-radius:8px; }

  /* INFO (予約タブ) */
  .sec { font-size:13px; font-weight:800; color:var(--blue); margin:18px 0 8px; letter-spacing:.5px; }
  .sec:first-child { margin-top:4px; }
  .info { background:var(--white); border-radius:var(--r); padding:13px 14px; box-shadow:var(--shadow); margin-bottom:10px; }
  .info h4 { font-size:14px; margin-bottom:6px; }
  .kv { display:flex; font-size:12.5px; padding:4px 0; border-bottom:1px solid #F1EEE7; }
  .kv:last-child { border-bottom:none; }
  .kv span { width:84px; flex-shrink:0; color:var(--ink-light); }
  .kv b { font-weight:600; white-space:pre-line; }
  .warn { background:var(--red-light); color:#8B2E1B; border-radius:8px; padding:8px 10px; font-size:12px; margin-top:8px; white-space:pre-line; }
  .tel { color:var(--blue); text-decoration:none; font-weight:600; }

  /* CHECKLIST */
  .ck { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #F1EEE7; font-size:14px; }
  .ck:last-child { border-bottom:none; }
  .ck input { width:20px; height:20px; accent-color:var(--blue); }
  .ck.done label { text-decoration:line-through; color:var(--ink-light); }
  .ck label { flex:1; }
  .ck .del { background:none; border:none; color:var(--ink-light); font-size:16px; cursor:pointer; padding:0 4px; }
  .addrow { display:flex; gap:8px; margin-top:10px; }
  .addrow input { flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:14px; font-family:inherit; }
  .addrow button { background:var(--blue); color:#fff; border:none; border-radius:10px; padding:0 14px; font-size:14px; cursor:pointer; }

  /* FAB */
  .fab {
    position:fixed; bottom:24px; right:calc(50% - 215px + 18px); width:54px; height:54px; border-radius:50%;
    background:var(--red); color:#fff; border:none; font-size:28px; box-shadow:0 4px 14px rgba(200,70,46,.4);
    cursor:pointer; z-index:60; line-height:1;
  }
  @media (max-width:460px) { .fab { right:18px; } }

  /* MODAL */
  .modal { position:fixed; inset:0; background:rgba(20,30,50,.5); display:none; align-items:flex-end; justify-content:center; z-index:100; }
  .modal.open { display:flex; }
  .sheet { background:var(--white); width:100%; max-width:430px; border-radius:20px 20px 0 0; padding:18px 18px 30px; max-height:92vh; overflow-y:auto; }
  .sheet h3 { font-size:16px; margin-bottom:14px; }
  .fld { margin-bottom:12px; }
  .fld label { font-size:11px; color:var(--ink-light); display:block; margin-bottom:4px; font-weight:600; }
  .fld input, .fld textarea, .fld select {
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:15px; font-family:inherit; background:#FAFAF8;
  }
  .fld textarea { min-height:80px; resize:vertical; }
  .typegrid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .tbtn { border:1px solid var(--line); background:#FAFAF8; border-radius:10px; padding:8px 2px; font-size:10px; cursor:pointer; text-align:center; }
  .tbtn span { display:block; font-size:20px; margin-bottom:2px; }
  .tbtn.sel { border-color:var(--blue); background:var(--blue-light); color:var(--blue); font-weight:700; }
  .btns { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-p { background:var(--blue); color:#fff; }
  .btn-s { background:#EEEBE3; color:var(--ink-mid); }
  .btn-d { background:var(--red-light); color:var(--red); flex:0 0 auto; padding:13px 16px; }
  .pgrid { display:flex; gap:6px; flex-wrap:wrap; }
  .pgrid .pi { position:relative; }
  .pgrid img { width:64px; height:64px; object-fit:cover; border-radius:8px; }
  .pgrid .px { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--red); color:#fff; border:none; font-size:12px; cursor:pointer; }
  .padd { width:64px; height:64px; border:2px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-light); cursor:pointer; text-align:center; }
  .viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:200; }
  .viewer.open { display:flex; }
  .viewer img { max-width:96%; max-height:92%; border-radius:6px; }
  .viewer button { position:absolute; top:18px; right:18px; background:rgba(255,255,255,.2); border:none; color:#fff; font-size:22px; width:40px; height:40px; border-radius:50%; cursor:pointer; }
  .help { font-size:12px; color:var(--ink-mid); line-height:1.6; margin-bottom:10px; white-space:pre-line; }
  .toast { position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:300; }
  .toast.show { opacity:1; }
</style>
</head>

<div id="app">
  <header class="hdr">
    <div class="hdr-btns">
      <button class="hbtn" onclick="openTitleModal()">✏️ 題名</button>
      <button class="hbtn" onclick="openShareModal()">📤 共有</button>
    </div>
    <div class="hdr-sub" id="hSub">姉妹旅行 2026</div>
    <div class="hdr-title" id="hTitle"></div>
    <div class="hdr-dates" id="hDates"></div>
    <div class="hdr-members"><span class="chip">なおみ</span><span class="chip">よっちゃん</span><span class="chip">お母さん</span></div>
  </header>
  <div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
  <main class="main" id="main"></main>
  <button class="fab" id="fab" onclick="openAddModal()">＋</button>
</div>

<!-- 予定編集 -->
<div class="modal" id="mEdit"><div class="sheet">
  <h3 id="mEditTitle">予定を編集</h3>
  <div class="fld"><label>種類</label><div class="typegrid" id="typeGrid"></div></div>
  <div class="fld"><label>時間（例：10:00 / 午前）</label><input id="fTime" placeholder="10:00"></div>
  <div class="fld"><label>タイトル</label><input id="fTitle" placeholder="例：有田でランチ"></div>
  <div class="fld"><label>くわしく</label><textarea id="fDetail" placeholder="場所・メモなど"></textarea></div>
  <div class="fld"><label>ひとことメモ（黄色で表示）</label><input id="fNote" placeholder="例：予約済み！"></div>
  <div class="fld"><label>写真</label><div class="pgrid" id="pGrid"></div><input type="file" id="pFile" accept="image/*" multiple style="display:none" onchange="onPhotoSelect(event)"></div>
  <div class="btns">
    <button class="btn btn-d" id="bDel" onclick="deleteEv()">削除</button>
    <button class="btn btn-s" onclick="closeModal('mEdit')">やめる</button>
    <button class="btn btn-p" onclick="saveEv()">保存</button>
  </div>
</div></div>

<!-- 題名 -->
<div class="modal" id="mTitle"><div class="sheet">
  <h3>題名を編集</h3>
  <div class="fld"><label>サブタイトル</label><input id="tSub"></div>
  <div class="fld"><label>題名</label><input id="tTitle"></div>
  <div class="fld"><label>日程</label><input id="tDates"></div>
  <div class="btns"><button class="btn btn-s" onclick="closeModal('mTitle')">やめる</button><button class="btn btn-p" onclick="saveTitle()">保存</button></div>
</div></div>

<!-- 共有 -->
<div class="modal" id="mShare"><div class="sheet">
  <h3>📤 よっちゃんと同期する</h3>
  <div class="help">予定を変えたら「データをコピー」→ LINEで相手に送る → 相手は下の欄に貼り付けて「読み込む」。
写真も一緒に送られます（多いと長くなります）。</div>
  <button class="btn btn-p" style="width:100%" onclick="exportData()">📋 データをコピー</button>
  <div class="fld" style="margin-top:16px"><label>受け取ったデータを貼り付け</label><textarea id="importTa" placeholder="ここに貼り付け"></textarea></div>
  <div class="btns"><button class="btn btn-s" onclick="closeModal('mShare')">閉じる</button><button class="btn btn-p" onclick="importData()">読み込む</button></div>
  <div class="help" style="margin-top:18px;color:var(--ink-light)">最初の内容に戻したいとき → <a href="#" onclick="resetData();return false;" style="color:var(--red)">リセット</a></div>
</div></div>

<div class="viewer" id="viewer" onclick="closeViewer()"><button onclick="closeViewer()">✕</button><img id="viewerImg"></div>
<div class="toast" id="toast"></div>

const STORE_KEY = 'arita_trip_2026';
let data = load();
let curTab = 0;           // 0..4 = days, 5 = 予約・持ち物
let editDayId = null, editEvId = null, editType = 'activity', editPhotos = [];

function load() {
  try {
    const s = localStorage.getItem(STORE_KEY);
    if (s) {
      const d = JSON.parse(s);
      if (d && d.days) {
        if (d.dataVersion === DATA_VERSION) return d;
        // 旅程が新しくなったとき：自分でつけた題名だけ引き継いで、中身は新しいものに
        const fresh = JSON.parse(JSON.stringify(DEFAULT));
        if (d.dataVersion >= 4) {
          if (d.sub) fresh.sub = d.sub;
          if (d.title) fresh.title = d.title;
          if (d.dateRange) fresh.dateRange = d.dateRange;
        }
        return fresh;
      }
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch(e) { toast('保存できませんでした（写真が多すぎるかも）'); }
}
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
function resolveImg(key) { return EMBEDDED_IMAGES[key] || key; }

function render() {
  document.getElementById('hSub').textContent = data.sub || '';
  document.getElementById('hTitle').textContent = data.title;
  document.getElementById('hDates').textContent = data.dateRange;
  document.title = data.title;
  renderTabs();
  if (curTab < data.days.length) renderDay(); else renderInfo();
  document.getElementById('fab').style.display = curTab < data.days.length ? 'block' : 'none';
  window.scrollTo(0, 0);
}
function renderTabs() {
  const t = document.getElementById('tabs');
  t.innerHTML = data.days.map((d, i) => `<button class="tab ${i === curTab ? 'active' : ''}" onclick="selTab(${i})">${h(d.label)}<small>${h(d.date.replace(/（.*/, ''))}</small></button>`).join('')
    + `<button class="tab ${curTab === data.days.length ? 'active' : ''}" onclick="selTab(${data.days.length})">📋 予約<small>持ち物</small></button>`;
}
function selTab(i) { curTab = i; render(); }

function renderDay() {
  const day = data.days[curTab];
  const m = document.getElementById('main');
  m.innerHTML = `
    <div class="day-hdr">
      <div class="day-num"><small>DAY</small><b>${curTab + 1}</b></div>
      <div><div class="day-title">${h(day.theme)}</div><div class="day-date">${h(day.date)}</div></div>
    </div>
    <div class="tl">${day.events.map(ev => renderEv(ev, day.id)).join('')}</div>
    ${day.events.length === 0 ? '<div class="help" style="text-align:center;padding:30px 0">まだ予定がありません。＋で追加してね</div>' : ''}`;
}

function renderEv(ev, dayId) {
  const tc = TYPES[ev.type] || TYPES.activity;
  const click = `onclick="openEdit('${dayId}','${ev.id}')"`;
  let inner = '';
  if (ev.type === 'flight' && ev.flightInfo) {
    const f = ev.flightInfo;
    inner = `<div class="fcard" ${click}>
      <div class="airline"><span>✈ ${h(f.airline)}</span>${f.seat ? `<span class="fseat">座席 ${h(f.seat)}</span>` : ''}</div>
      <div class="froute">
        <div class="fpt"><b>${h(f.from)}</b><span>${h(f.fromCity)}</span><em>${h(f.dep)}</em></div>
        <div class="fline"></div>
        <div class="fpt"><b>${h(f.to)}</b><span>${h(f.toCity)}</span><em>${h(f.arr)}</em></div>
      </div>
      <div class="fmeta">${h(ev.detail)}</div>
      ${ev.note ? `<div class="card-note" style="background:rgba(255,255,255,.15);color:#fff">${h(ev.note)}</div>` : ''}
      ${photosHtml(ev, dayId)}
    </div>`;
  } else {
    inner = `<div class="card" ${click}>
      <span class="edit-hint">✏️</span>
      <div class="card-top">
        <div class="ico">${tc.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="card-time">${h(ev.time)}</div>
          <div class="card-title">${h(ev.title)}</div>
          ${ev.detail ? `<div class="card-detail">${h(ev.detail)}</div>` : ''}
          ${ev.refLink ? `<a class="card-link" href="${h(ev.refLink)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 くわしく見る</a>` : ''}
          ${ev.note ? `<div class="card-note">💡 ${h(ev.note)}</div>` : ''}
          ${ev.refImage ? `<div class="refimg" onclick="event.stopPropagation();openImgViewer(resolveImg('${h(ev.refImage)}'))"><img src="${resolveImg(ev.refImage)}" alt="参考画像"></div><div class="refcap">${h(ev.refCap || '')}（タップで拡大）</div>` : ''}
          ${photosHtml(ev, dayId)}
          ${ev.backup ? `<div class="bk" id="bk_${ev.id}" onclick="event.stopPropagation()"><button class="bk-t" onclick="toggleBk('bk_${ev.id}')">${h(ev.backup.title)}</button><div class="bk-body">${h(ev.backup.detail)}</div></div>` : ''}
        </div>
      </div>
    </div>`;
  }
  return `<div class="ev ${ev.type}">${inner}</div>`;
}
function photosHtml(ev, dayId) {
  if (!ev.photos || !ev.photos.length) return '';
  return `<div class="photos">${ev.photos.map((p, i) => `<img src="${p}" onclick="event.stopPropagation();openViewer('${dayId}','${ev.id}',${i})">`).join('')}</div>`;
}
function toggleBk(id) { document.getElementById(id).classList.toggle('open'); }

}
function toggleCk(id) { const c = data.checklist.find(x => x.id === id); if (c) { c.done = !c.done; save(); renderInfo(); } }
function delCk(id) { data.checklist = data.checklist.filter(x => x.id !== id); save(); renderInfo(); }
function addCk() {
  const inp = document.getElementById('ckNew'); const t = inp.value.trim(); if (!t) return;
  data.checklist = data.checklist || []; data.checklist.push({ id:'c' + Date.now(), text:t, done:false }); save(); renderInfo();
}

/* ---------- 予定の編集 ---------- */
function renderTypeGrid() {
  document.getElementById('typeGrid').innerHTML = Object.entries(TYPES).map(([k, v]) =>
    `<button class="tbtn ${k === editType ? 'sel' : ''}" onclick="editType='${k}';renderTypeGrid()"><span>${v.icon}</span>${v.label}</button>`).join('');
}
function openEdit(dayId, evId) {
  const day = data.days.find(d => d.id === dayId); const ev = day.events.find(e => e.id === evId);
  editDayId = dayId; editEvId = evId; editType = ev.type; editPhotos = (ev.photos || []).slice();
  document.getElementById('mEditTitle').textContent = '予定を編集';
  document.getElementById('fTime').value = ev.time || '';
  document.getElementById('fTitle').value = ev.title || '';
  document.getElementById('fDetail').value = ev.detail || '';
  document.getElementById('fNote').value = ev.note || '';
  document.getElementById('bDel').style.display = 'block';
  renderTypeGrid(); renderPhotoGrid(); openModal('mEdit');
}
function openAddModal() {
  editDayId = data.days[curTab].id; editEvId = null; editType = 'activity'; editPhotos = [];
  document.getElementById('mEditTitle').textContent = '予定を追加';
  ['fTime','fTitle','fDetail','fNote'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('bDel').style.display = 'none';
  renderTypeGrid(); renderPhotoGrid(); openModal('mEdit');
}
function saveEv() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { toast('タイトルを入れてね'); return; }
  const day = data.days.find(d => d.id === editDayId);
  const fields = { time:document.getElementById('fTime').value.trim(), type:editType, title, detail:document.getElementById('fDetail').value, note:document.getElementById('fNote').value.trim(), photos:editPhotos };
  if (editEvId) {
    const ev = day.events.find(e => e.id === editEvId);
    Object.assign(ev, fields);
    if (ev.type !== 'flight') delete ev.flightInfo;
  } else {
    day.events.push(Object.assign({ id:'e' + Date.now() }, fields));
  }
  save(); closeModal('mEdit'); render(); toast('保存しました');
}
function deleteEv() {
  if (!confirm('この予定を削除しますか？')) return;
  const day = data.days.find(d => d.id === editDayId);
  day.events = day.events.filter(e => e.id !== editEvId);
  save(); closeModal('mEdit'); render(); toast('削除しました');
}

/* 写真 */
function renderPhotoGrid() {
  document.getElementById('pGrid').innerHTML = editPhotos.map((p, i) => `<div class="pi"><img src="${p}"><button class="px" onclick="editPhotos.splice(${i},1);renderPhotoGrid()">✕</button></div>`).join('')
    + `<div class="padd" onclick="document.getElementById('pFile').click()">📷<br>追加</div>`;
}
function onPhotoSelect(e) {
  const files = Array.from(e.target.files || []);
  Promise.all(files.map(compressImage)).then(list => { editPhotos.push(...list.filter(Boolean)); renderPhotoGrid(); });
  e.target.value = '';
}
function compressImage(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 800; let w = img.width, hh = img.height;
        if (w > hh && w > MAX) { hh = hh * MAX / w; w = MAX; } else if (hh > MAX) { w = w * MAX / hh; hh = MAX; }
        const c = document.createElement('canvas'); c.width = w; c.height = hh;
        c.getContext('2d').drawImage(img, 0, 0, w, hh);
        res(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => res(null);
      img.src = ev.target.result;
    };
    r.readAsDataURL(file);
  });
}
function openViewer(dayId, evId, idx) {
  const ev = data.days.find(d => d.id === dayId).events.find(e => e.id === evId);
  openImgViewer(ev.photos[idx]);
}
function openImgViewer(src) { document.getElementById('viewerImg').src = src; document.getElementById('viewer').classList.add('open'); }
function closeViewer() { document.getElementById('viewer').classList.remove('open'); }

/* 題名 */
function openTitleModal() {
  document.getElementById('tSub').value = data.sub || '';
  document.getElementById('tTitle').value = data.title;
  document.getElementById('tDates').value = data.dateRange;
  openModal('mTitle');
}
function saveTitle() {
  data.sub = document.getElementById('tSub').value.trim();
  data.title = document.getElementById('tTitle').value.trim() || data.title;
  data.dateRange = document.getElementById('tDates').value.trim();
  save(); closeModal('mTitle'); render();
}

/* 共有 */
function openShareModal() { document.getElementById('importTa').value = ''; openModal('mShare'); }
function exportData() {
  const json = JSON.stringify(data);
  const done = () => toast('コピーしました。LINEに貼り付けて送ってね');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done).catch(() => fallbackCopy(json, done));
  else fallbackCopy(json, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { toast('コピーできませんでした'); }
  document.body.removeChild(ta);
}
function importData() {
  const json = document.getElementById('importTa').value.trim();
  if (!json) { toast('データを貼り付けてね'); return; }
  try {
    const d = JSON.parse(json);
    if (!d.days || !Array.isArray(d.days)) throw new Error();
    data = d; save(); closeModal('mShare'); render(); toast('読み込みました');
  } catch(e) { toast('データの形が違うみたい'); }
}
function resetData() {
  if (!confirm('自分で追加・変更した内容と写真が消えて、最初の内容に戻ります。よろしいですか？')) return;
  data = JSON.parse(JSON.stringify(DEFAULT)); save(); closeModal('mShare'); render(); toast('最初の内容に戻しました');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

render();
</script>
